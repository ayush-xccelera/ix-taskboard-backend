services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgres://taskboard:taskboard@db:5432/taskboard
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - taskboard-db-data:/var/lib/postgresql/data

volumes:
  taskboard-db-data:
